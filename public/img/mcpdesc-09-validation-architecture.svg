<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">MCP Description validation architecture</title>
  <desc id="desc">MCP, MCP Description, and JSON Schema requirements feed an 85-rule catalog used by the validator to report traceable results.</desc>
  <rect width="1440" height="820" fill="#f8fafd"/>
  <text x="64" y="72" fill="#2868ce" font-family="Arial,sans-serif" font-size="18" font-weight="700">MCP DESCRIPTION 0.9</text>
  <text x="64" y="132" fill="#102142" font-family="Arial,sans-serif" font-size="42" font-weight="700">Validation: requirements to results</text>
  <text x="64" y="176" fill="#41536d" font-family="Arial,sans-serif" font-size="22">Rule selection depends on the format and each applicable MCP protocol version.</text>
  <rect x="64" y="230" width="300" height="150" rx="20" fill="#ebf3ff" stroke="#a6c6f3" stroke-width="3"/>
  <text x="214" y="282" text-anchor="middle" fill="#102142" font-family="Arial,sans-serif" font-size="27" font-weight="700">Description document</text>
  <text x="214" y="322" text-anchor="middle" fill="#41536d" font-family="Arial,sans-serif" font-size="19">MCP Description 0.9</text>
  <text x="214" y="351" text-anchor="middle" fill="#41536d" font-family="Arial,sans-serif" font-size="19">Protocol-version scopes</text>
  <text x="905" y="215" text-anchor="middle" fill="#2868ce" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">REQUIREMENT SOURCES</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="410" y="235" width="290" height="145" rx="18" fill="#eef5ff" stroke="#2868ce" stroke-width="2"/><text x="555" y="280" fill="#102142" font-size="27" font-weight="700">MCP</text><text x="555" y="315" fill="#2868ce" font-size="22" font-weight="700">46 rules</text><text x="555" y="348" fill="#41536d" font-size="17">Protocol requirements</text>
    <rect x="735" y="235" width="290" height="145" rx="18" fill="#f4f0fc" stroke="#7056b8" stroke-width="2"/><text x="880" y="280" fill="#102142" font-size="25" font-weight="700">MCP Description</text><text x="880" y="315" fill="#7056b8" font-size="22" font-weight="700">38 rules</text><text x="880" y="348" fill="#41536d" font-size="17">Document semantics</text>
    <rect x="1060" y="235" width="290" height="145" rx="18" fill="#eff9f5" stroke="#0e977a" stroke-width="2"/><text x="1205" y="280" fill="#102142" font-size="25" font-weight="700">JSON Schema</text><text x="1205" y="315" fill="#0e977a" font-size="22" font-weight="700">1 rule</text><text x="1205" y="348" fill="#41536d" font-size="17">Embedded schema checks</text>
  </g>
  <path d="M555 380v46M880 380v46M1205 380v46M555 426h650M880 426v34" fill="none" stroke="#7056b8" stroke-width="4"/>
  <path d="M880 460v22" stroke="#7056b8" stroke-width="4"/><path d="m871 476 9 12 9-12" fill="#7056b8"/>
  <rect x="390" y="490" width="980" height="112" rx="22" fill="#f2eeff" stroke="#b7a4e6" stroke-width="3"/>
  <text x="880" y="538" text-anchor="middle" fill="#102142" font-family="Arial,sans-serif" font-size="30" font-weight="700">Curated Rules Catalog — 85 rules</text>
  <text x="880" y="574" text-anchor="middle" fill="#41536d" font-family="Arial,sans-serif" font-size="19">Requirement provenance · Version applicability · Conformance fixtures</text>
  <path d="M214 380v260h180M880 602v38" fill="none" stroke="#2868ce" stroke-width="4"/>
  <path d="m382 631 12 9-12 9" fill="#2868ce"/><path d="m871 629 9 12 9-12" fill="#147a54"/>
  <rect x="394" y="640" width="976" height="94" rx="22" fill="#ebf7f2" stroke="#94d2bb" stroke-width="3"/>
  <text x="882" y="681" text-anchor="middle" fill="#102142" font-family="Arial,sans-serif" font-size="30" font-weight="700">@mcpdesc/validator</text>
  <text x="882" y="713" text-anchor="middle" fill="#147a54" font-family="Arial,sans-serif" font-size="18">Version-aware rule execution and traceable diagnostics</text>
  <text x="720" y="774" text-anchor="middle" fill="#667894" font-family="Arial,sans-serif" font-size="16">A rule that passed is different from one that was not applicable or not evaluated. Historical conformance has documented limits.</text>
