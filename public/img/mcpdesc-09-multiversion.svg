<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">One MCP Description, multiple MCP generations</title>
  <desc id="desc">A single MCP Description 0.9 document can describe five MCP protocol revisions, with version-scoped declarations and applicable requirements for each.</desc>
  <rect width="1440" height="820" fill="#f8fafd"/>
  <text x="64" y="72" fill="#2868ce" font-family="Arial,sans-serif" font-size="18" font-weight="700">MCP DESCRIPTION 0.9</text>
  <text x="64" y="132" fill="#102142" font-family="Arial,sans-serif" font-size="42" font-weight="700">One description, multiple MCP generations</text>
  <text x="64" y="176" fill="#41536d" font-family="Arial,sans-serif" font-size="22">A single document can describe several protocol revisions, each with its own applicable requirements.</text>
  <rect x="250" y="220" width="940" height="150" rx="24" fill="#edf4ff" stroke="#a7c6f4" stroke-width="3"/>
  <text x="720" y="274" text-anchor="middle" fill="#102142" font-family="Arial,sans-serif" font-size="32" font-weight="700">MCP Description 0.9 document</text>
